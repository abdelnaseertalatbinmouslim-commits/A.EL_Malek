<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Hub | Dr. Ali Saad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4 md:p-8">
    
    <header class="glass-panel p-6 mb-10 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black en-title">STUDENT PLATFORM</h1>
            <p class="text-blue-400 text-xs">مرحباً بك في رحلة التعلم</p>
        </div>
    </header>

    <div class="mb-10">
        <h2 class="text-xl font-black mb-6 border-r-4 border-blue-600 pr-3">الأقسام التعليمية</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div onclick="filter('السباحة')" class="glass-panel p-8 text-center cursor-pointer glass-card-interactive">
                <span class="text-3xl">🏊‍♂️</span>
                <h3 class="mt-2 font-bold">السباحة</h3>
            </div>
            <div onclick="filter('إنقاذ')" class="glass-panel p-8 text-center cursor-pointer glass-card-interactive">
                <span class="text-3xl">🛟</span>
                <h3 class="mt-2 font-bold">الإنقاذ</h3>
            </div>
            <div onclick="filter('إعداد معلم')" class="glass-panel p-8 text-center cursor-pointer glass-card-interactive">
                <span class="text-3xl">🎓</span>
                <h3 class="mt-2 font-bold">إعداد معلم</h3>
            </div>
        </div>
    </div>

    <div id="content-area" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-16">
        </div>

    <div class="mt-20">
        <h2 class="text-xl font-black mb-8 border-r-4 border-yellow-500 pr-3">توثيق الدورات والمواسم السابقة</h2>
        <div id="doc-area" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            </div>
    </div>

    <script>
        function filter(category) {
            const lessons = JSON.parse(localStorage.getItem('lessons')) || [];
            const area = document.getElementById('content-area');
            const filtered = lessons.filter(l => l.type === category);
            
            area.innerHTML = filtered.map(l => `
                <div class="glass-panel p-4">
                    <div class="flex justify-between mb-2">
                        <span class="text-[10px] bg-blue-600 px-2 py-1 rounded">${l.mode}</span>
                    </div>
                    <h4 class="font-bold mb-4">${l.title}</h4>
                    <a href="${l.link}" class="btn-primary w-full py-2 block text-center text-xs">مشاهدة المحاضرة</a>
                </div>
            `).join('');
        }

        function loadDocs() {
            const docs = JSON.parse(localStorage.getItem('docs')) || [];
            const area = document.getElementById('doc-area');
            area.innerHTML = docs.map(d => `
                <div class="glass-panel overflow-hidden">
                    <img src="${d.img}" class="w-full h-32 object-cover">
                    <div class="p-3">
                        <p class="text-[10px] font-bold">${d.title}</p>
                        <p class="text-[8px] text-slate-500">${d.date}</p>
                    </div>
                </div>
            `).join('');
        }
        loadDocs();
    </script>
</body>
</html>
