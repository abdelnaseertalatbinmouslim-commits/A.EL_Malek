<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | المهندس عبد الناصر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #020617; color: white; }
        .glass-table { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); }
        th { background: rgba(59, 130, 246, 0.1); color: #3b82f6; font-weight: 900; }
        td { border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
    </style>
</head>
<body class="p-6 md:p-12">
    
    <header class="flex justify-between items-center mb-12">
        <div>
            <h1 class="text-3xl font-black">إدارة المنصة الدولية 🔐</h1>
            <p class="text-blue-500 font-bold">مرحباً يا دكتور علي سعد</p>
        </div>
        <button class="bg-red-600/20 text-red-500 px-6 py-2 rounded-xl font-bold border border-red-600/30">تسجيل الخروج</button>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
        <div class="bg-blue-600 p-6 rounded-3xl">
            <h4 class="text-xs opacity-80 mb-2">إجمالي المشتركين</h4>
            <p class="text-3xl font-black">128</p>
        </div>
        <div class="bg-yellow-600 p-6 rounded-3xl">
            <h4 class="text-xs opacity-80 mb-2">طلبات بانتظار القبول</h4>
            <p class="text-3xl font-black">12</p>
        </div>
    </div>

    <h2 class="text-xl font-black mb-6 flex items-center gap-3">
        <span class="w-2 h-8 bg-blue-600 rounded-full"></span> طلبات التسجيل الجديدة
    </h2>

    <div class="glass-table w-full overflow-x-auto">
        <table class="w-full text-right">
            <thead>
                <tr>
                    <th class="p-5">الطالب</th>
                    <th class="p-5">الرقم القومي</th>
                    <th class="p-5">رقم الهاتف</th>
                    <th class="p-5">الإجراء</th>
                </tr>
            </thead>
            <tbody>
                <tr class="hover:bg-white/5 transition">
                    <td class="p-5 font-bold">أحمد محمد علي</td>
                    <td class="p-5 text-slate-400">29901011234567</td>
                    <td class="p-5 text-slate-400">01023456789</td>
                    <td class="p-5 flex gap-2">
                        <button class="bg-green-600 px-4 py-2 rounded-lg text-xs font-bold">قبول</button>
                        <button class="bg-red-600/50 px-4 py-2 rounded-lg text-xs font-bold">رفض</button>
                    </td>
                </tr>
                </tbody>
        </table>
    </div>

    <div class="mt-12 opacity-30 text-center">
        <p class="text-[10px] font-bold">OFFICIAL ADMIN PANEL - SYSTEM BY ENG. ABDEL NASSER</p>
    </div>

</body>
</html>
