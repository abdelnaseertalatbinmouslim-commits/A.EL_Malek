<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control | Dr. Ali Saad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4 md:p-8">
    <div class="bg-blob blob-1"></div>
    
    <header class="flex justify-between items-center mb-10 glass-panel p-5">
        <h1 class="text-xl font-black">إدارة الأقسام والخدمات</h1>
        <button onclick="location.href='index.html'" class="text-red-500 font-bold text-xs">خروج</button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-1 space-y-6">
            <section class="glass-panel p-6">
                <h3 class="text-blue-500 font-black mb-4">رفع درس (نظري/عملي)</h3>
                <div class="space-y-3">
                    <select id="course-type" class="input-glass">
                        <option value="السباحة">قسم السباحة</option>
                        <option value="إنقاذ">قسم الإنقاذ</option>
                        <option value="إعداد معلم">قسم إعداد معلم</option>
                    </select>
                    <select id="study-mode" class="input-glass">
                        <option value="عملي">فيديو عملي</option>
                        <option value="نظري">شرح نظري</option>
                    </select>
                    <input type="text" id="v-title" placeholder="عنوان الدرس" class="input-glass">
                    <input type="text" id="v-link" placeholder="رابط الفيديو" class="input-glass">
                    <button onclick="addLesson()" class="btn-primary w-full">نشر المحتوى</button>
                </div>
            </section>

            <section class="glass-panel p-6">
                <h3 class="text-yellow-500 font-black mb-4">توثيق (دورات/صور مواسم)</h3>
                <div class="space-y-3">
                    <input type="text" id="doc-title" placeholder="اسم الدورة أو الموسم" class="input-glass">
                    <input type="date" id="doc-date" class="input-glass">
                    <input type="text" id="doc-img" placeholder="رابط الصورة" class="input-glass">
                    <button onclick="addDoc()" class="btn-primary w-full bg-yellow-600">إضافة للتوثيق</button>
                </div>
            </section>
        </div>

        <div class="lg:col-span-2">
            <div class="glass-panel p-6 h-full">
                <h3 class="font-black mb-6">طلبات الإلتحاق والمتابعة</h3>
                <div id="admin-student-list" class="space-y-4">
                    </div>
            </div>
        </div>
    </div>

    <script>
        function addLesson() {
            const lesson = {
                type: document.getElementById('course-type').value,
                mode: document.getElementById('study-mode').value,
                title: document.getElementById('v-title').value,
                link: document.getElementById('v-link').value
            };
            let data = JSON.parse(localStorage.getItem('lessons')) || [];
            data.push(lesson);
            localStorage.setItem('lessons', JSON.stringify(data));
            alert("تم رفع الدرس التعليمي");
        }

        function addDoc() {
            const doc = {
                title: document.getElementById('doc-title').value,
                date: document.getElementById('doc-date').value,
                img: document.getElementById('doc-img').value
            };
            let data = JSON.parse(localStorage.getItem('docs')) || [];
            data.push(doc);
            localStorage.setItem('docs', JSON.stringify(data));
            alert("تم إضافة التوثيق بنجاح");
        }
    </script>
</body>
</html>
