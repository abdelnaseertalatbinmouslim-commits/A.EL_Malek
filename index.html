<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>International Platform | Dr. Ali Saad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* إضافة لمسة احترافية للغة الإنجليزية في العناوين */
        .en-title { font-family: 'sans-serif'; letter-spacing: 1px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="container max-w-6xl grid grid-cols-1 lg:grid-cols-2 gap-8 items-center relative z-10">
        
        <div id="cv-section" class="space-y-6 text-right p-4">
            <div class="flex flex-col items-start lg:items-end">
                <img src="IMG-20260408-WA0090.jpg" class="w-24 h-24 md:w-32 md:h-32 rounded-3xl border-2 border-blue-500 shadow-2xl object-cover mb-4">
                <h1 class="text-3xl md:text-5xl font-black en-title text-white uppercase">Dr. Ali Saad</h1>
                <h2 class="text-blue-500 font-bold text-lg md:text-xl mt-2">INTERNATIONAL PLATFORM</h2>
            </div>

            <div class="glass-panel p-6 space-y-4 border-r-4 border-blue-600">
                <div class="flex items-start gap-3">
                    <span class="text-blue-500 mt-1">✦</span>
                    <p class="text-sm md:text-base font-bold text-slate-100">مدرس مساعد بكلية علوم الرياضة - تخصص سباحة</p>
                </div>
                <div class="flex items-start gap-3">
                    <span class="text-blue-500 mt-1">✦</span>
                    <p class="text-sm md:text-base font-bold text-slate-100">المدير الفني لبرنامج "البطل الذهبي" لتعليم السباحة بأسيوط</p>
                </div>
                <div class="flex items-start gap-3">
                    <span class="text-blue-500 mt-1">✦</span>
                    <p class="text-sm md:text-base font-bold text-slate-100">مدرب إنقاذ دولي معتمد من الاتحاد المصري والدولي للغوص والإنقاذ (ILD)</p>
                </div>
            </div>
            
            <div class="flex gap-4 opacity-70">
                <div class="text-[10px] font-bold border border-white/20 px-3 py-1 rounded-full uppercase">Swimming Expert</div>
                <div class="text-[10px] font-bold border border-white/20 px-3 py-1 rounded-full uppercase">International Trainer</div>
            </div>
        </div>

        <div class="glass-panel p-6 md:p-10 w-full">
            <div class="tab-nav flex justify-center lg:justify-start gap-8">
                <button onclick="switchTab('login')" id="login-tab" class="tab-btn active text-lg">دخول</button>
                <button onclick="switchTab('register')" id="register-tab" class="tab-btn text-lg">طالب جديد</button>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div class="input-group">
                    <label class="input-label">البريد الإلكتروني</label>
                    <input type="email" id="l-email" placeholder="example@gmail.com" class="input-glass" required>
                </div>
                <div class="input-group">
                    <label class="input-label">كلمة المرور</label>
                    <input type="password" id="l-pass" placeholder="••••••••" class="input-glass" required>
                </div>
                <button type="submit" class="btn-primary w-full py-4 text-lg">LOGIN TO PLATFORM</button>
            </form>

            <form id="register-form" class="hidden space-y-3" onsubmit="handleRegister(event)">
                <input type="text" id="r-name" placeholder="الاسم الرباعي" class="input-glass" required>
                <div class="grid grid-cols-2 gap-2">
                    <input type="tel" id="r-phone" placeholder="رقم الهاتف" class="input-glass" required>
                    <input type="text" id="r-id" placeholder="الرقم القومي" class="input-glass" required>
                </div>
                <input type="email" id="r-email" placeholder="البريد الإلكتروني" class="input-glass" required>
                <input type="password" id="r-pass" placeholder="كلمة المرور" class="input-glass" required>
                <button type="submit" class="btn-primary w-full py-4">REQUEST REGISTRATION</button>
            </form>
            
            <p id="msg" class="text-center text-xs mt-4 font-bold text-blue-400"></p>
        </div>
    </div>

    <footer class="fixed bottom-4 text-center w-full pointer-events-none">
        <p class="text-[9px] md:text-[11px] font-bold tracking-[0.3em] opacity-30 uppercase">
            Developed by Eng. Abdel Nasser
        </p>
    </footer>

    <script>
        const ADMIN_EMAIL = "doctor.ali.saad@gmail.com";
        const ADMIN_PASS = "Dr.AliSaad111222#";

        function switchTab(t) {
            document.getElementById('login-form').classList.toggle('hidden', t === 'register');
            document.getElementById('register-form').classList.toggle('hidden', t === 'login');
            document.getElementById('login-tab').className = t === 'login' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('register-tab').className = t === 'register' ? 'tab-btn active' : 'tab-btn';
        }

        function handleRegister(e) {
            e.preventDefault();
            const student = {
                name: document.getElementById('r-name').value,
                phone: document.getElementById('r-phone').value,
                id: document.getElementById('r-id').value,
                email: document.getElementById('r-email').value,
                pass: document.getElementById('r-pass').value,
                status: 'pending'
            };
            let students = JSON.parse(localStorage.getItem('students')) || [];
            students.push(student);
            localStorage.setItem('students', JSON.stringify(students));
            document.getElementById('msg').innerText = "تم إرسال طلبك. سيقوم الدكتور بمراجعته والموافقة عليه قريباً.";
            e.target.reset();
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('l-email').value;
            const pass = document.getElementById('l-pass').value;

            if(email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                location.href = 'admin.html';
                return;
            }

            let students = JSON.parse(localStorage.getItem('students')) || [];
            const user = students.find(s => s.email === email && s.pass === pass);
            
            if(user) {
                if(user.status === 'active') {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    location.href = 'student.html';
                } else {
                    alert("عذراً، حسابك قيد المراجعة لدى الإدارة.");
                }
            } else {
                alert("البريد الإلكتروني أو كلمة المرور غير صحيحة.");
            }
        }
    </script>
</body>
</html>
