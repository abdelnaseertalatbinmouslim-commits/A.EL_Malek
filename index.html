<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة الدولية | د. علي سعد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #020617; overflow-x: hidden; color: white; }
        
        /* تصميم الزجاج الاحترافي */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        .input-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s;
        }
        .input-glass:focus {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            outline: none;
        }

        .btn-shiny {
            background: linear-gradient(45deg, #1d4ed8, #3b82f6);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: all 0.3s;
        }
        .btn-shiny:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6); }

        .tab-btn { transition: all 0.3s; border-bottom: 2px solid transparent; }
        .tab-btn.active { border-color: #3b82f6; color: #3b82f6; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="fixed top-0 -left-20 w-72 h-72 bg-blue-600/20 rounded-full blur-[120px]"></div>
    <div class="fixed bottom-0 -right-20 w-72 h-72 bg-purple-600/10 rounded-full blur-[120px]"></div>

    <div class="container max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-12 items-center relative z-10">
        
        <div id="cv-section" class="space-y-6 text-right">
            <div class="relative inline-block">
                <img src="IMG-20260408-WA0090.jpg" alt="Dr. Ali" class="w-32 h-32 rounded-3xl object-cover border-2 border-blue-500 shadow-2xl mb-4">
                <div class="absolute -bottom-2 -right-2 bg-blue-600 p-1 rounded-full text-[10px]">✔</div>
            </div>
            <h1 class="text-5xl font-black tracking-tight">د. علي سعد <span class="text-blue-500">أبو ضيف</span></h1>
            <p class="text-slate-400 leading-relaxed text-lg">
                خبير التدريب الدولي والإنقاذ، ومؤسس الأكاديمية الدولية للسباحة. نهتم ببناء جيل رياضي محترف وفق معايير علمية دقيقة.
            </p>
            <div class="grid grid-cols-2 gap-4 pt-4">
                <div class="glass-panel p-4 text-center">
                    <h4 class="text-blue-500 font-bold text-2xl">10+</h4>
                    <p class="text-xs text-slate-500">سنوات خبرة</p>
                </div>
                <div class="glass-panel p-4 text-center">
                    <h4 class="text-blue-500 font-bold text-2xl">1000+</h4>
                    <p class="text-xs text-slate-500">خريج معتمد</p>
                </div>
            </div>
        </div>

        <div class="glass-panel p-8 lg:p-10 shadow-2xl relative overflow-hidden">
            
            <div class="flex gap-8 mb-8 border-b border-white/5">
                <button onclick="switchTab('login')" id="login-tab" class="tab-btn active pb-3 font-bold">تسجيل الدخول</button>
                <button onclick="switchTab('register')" id="register-tab" class="tab-btn pb-3 font-bold text-slate-500">طالب جديد</button>
            </div>

            <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">البريد الإلكتروني</label>
                    <input type="email" id="login-email" required class="w-full p-4 rounded-xl input-glass" placeholder="example@mail.com">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">كلمة المرور</label>
                    <input type="password" id="login-pass" required class="w-full p-4 rounded-xl input-glass" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-4 rounded-xl btn-shiny font-bold text-lg">دخول المنصة</button>
            </form>

            <form id="register-form" class="space-y-4 hidden" onsubmit="handleRegister(event)">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">الاسم الرباعي</label>
                        <input type="text" required class="w-full p-3 rounded-xl input-glass text-sm">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">رقم الهاتف</label>
                        <input type="tel" required class="w-full p-3 rounded-xl input-glass text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">الرقم القومي (14 رقم)</label>
                    <input type="text" maxlength="14" required class="w-full p-3 rounded-xl input-glass text-sm">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">البريد الإلكتروني</label>
                    <input type="email" required class="w-full p-3 rounded-xl input-glass text-sm">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">كلمة المرور</label>
                    <input type="password" required class="w-full p-3 rounded-xl input-glass text-sm">
                </div>
                <button type="submit" class="w-full py-4 rounded-xl btn-shiny font-bold">إنشاء حساب بانتظار القبول</button>
            </form>

            <p id="msg-box" class="mt-6 text-center text-sm font-bold text-blue-400 hidden"></p>
        </div>
    </div>

    <footer class="fixed bottom-6 text-center w-full opacity-30">
        <p class="text-[10px] font-bold tracking-widest">DEVELOPED BY ENG. ABDEL NASSER</p>
    </footer>

    <script>
        // بيانات الأدمن اللي حضرتك طلبتها
        const ADMIN_EMAIL = "doctor.ali.saad@gmail.com";
        const ADMIN_PASS = "Dr.AliSaad111222#";

        function switchTab(type) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginTab = document.getElementById('login-tab');
            const registerTab = document.getElementById('register-tab');

            if(type === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;

            if(email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                alert("مرحباً يا دكتور علي.. جاري فتح لوحة الإدارة");
                window.location.href = "admin.html"; // سيتم إنشاؤه
            } else {
                // محاكاة دخول طالب مقبول
                alert("تم تسجيل الدخول بنجاح.. جاري نقلك للمنصة");
                window.location.href = "student.html"; // سيتم إنشاؤه
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const msgBox = document.getElementById('msg-box');
            msgBox.innerText = "تم إنشاء حسابك بنجاح.. بانتظار قبول المشرف لتتمكن من الدخول.";
            msgBox.classList.remove('hidden');
            e.target.reset();
        }

        // أنيميشن البداية
        gsap.from("#cv-section", { duration: 1, x: 50, opacity: 0, ease: "power3.out" });
        gsap.from(".glass-panel", { duration: 1, x: -50, opacity: 0, delay: 0.2, ease: "power3.out" });
    </script>
</body>
</html>
