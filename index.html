<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>International Platform | Dr. Ali Saad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #020617; --txt: #ffffff; --glass: rgba(255,255,255,0.03); --border: rgba(255,255,255,0.1); }
        .light { --bg: #f8fafc; --txt: #020617; --glass: rgba(255,255,255,0.7); --border: rgba(0,0,0,0.05); }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--txt); transition: 0.3s; overflow-x: hidden; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .glass { background: var(--glass); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 24px; }
        .btn-primary { background: linear-gradient(45deg, #1d4ed8, #3b82f6); color: white; padding: 14px; border-radius: 12px; font-weight: 900; width: 100%; transition: 0.3s; cursor: pointer; border:none; }
        .input-glass { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; color: var(--txt); outline: none; }
        .bg-blob { position: fixed; width: 300px; height: 300px; filter: blur(120px); z-index: -1; opacity: 0.4; border-radius: 50%; }
        .tab-btn { padding: 10px 20px; font-weight: 700; color: #64748b; border-bottom: 2px solid transparent; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { color: #3b82f6; border-color: #3b82f6; }
    </style>
</head>
<body>
    <div class="bg-blob bg-blue-600 top-0 left-0"></div>
    <div class="bg-blob bg-purple-600 bottom-0 right-0"></div>
    
    <button onclick="document.body.classList.toggle('light')" class="fixed top-5 right-5 glass p-3 rounded-full z-50">🌓</button>

    <div class="container max-w-5xl px-4 grid grid-cols-1 lg:grid-cols-2 gap-10 items-center relative">
        <div class="text-right space-y-6">
            <div class="relative inline-block">
                <img src="IMG-20260408-WA0090.jpg" alt="Dr. Ali Saad" class="w-32 h-32 rounded-3xl border-2 border-blue-500 object-cover shadow-2xl">
                <div class="absolute -bottom-2 -right-2 bg-blue-600 text-[10px] px-2 py-1 rounded-lg font-bold">OFFICIAL</div>
            </div>
            <h1 class="text-4xl font-black uppercase tracking-tight">Dr. Ali Saad</h1>
            <h2 class="text-blue-500 font-bold tracking-[0.2em] text-sm">INTERNATIONAL PLATFORM</h2>
            <div class="glass p-5 space-y-4 border-r-4 border-blue-600">
                <p class="text-xs md:text-sm font-bold opacity-90">✦ مدرس مساعد بكلية علوم الرياضة - تخصص سباحة</p>
                <p class="text-xs md:text-sm font-bold opacity-90">✦ المدير الفني لبرنامج "البطل الذهبي" بأسيوط</p>
                <p class="text-xs md:text-sm font-bold opacity-90">✦ مدرب إنقاذ دولي معتمد من الاتحاد المصري والدولي (ILD)</p>
            </div>
        </div>

        <div class="glass p-6 md:p-10 shadow-2xl">
            <div class="flex gap-6 mb-8 border-b border-white/5">
                <button onclick="tab('login')" id="l-t" class="tab-btn active">دخول</button>
                <button onclick="tab('reg')" id="r-t" class="tab-btn">طالب جديد</button>
            </div>

            <form id="f-l" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-[10px] mb-2 opacity-50">البريد الإلكتروني</label>
                    <input type="email" id="le" placeholder="doctor.ali.saad@gmail.com" class="input-glass" required>
                </div>
                <div>
                    <label class="block text-[10px] mb-2 opacity-50">كلمة المرور</label>
                    <input type="password" id="lp" placeholder="••••••••" class="input-glass" required>
                </div>
                <button type="submit" class="btn-primary mt-4">LOGIN TO PLATFORM</button>
            </form>

            <form id="f-r" class="hidden space-y-4" onsubmit="handleRegister(event)">
                <input type="text" id="rn" placeholder="الاسم الرباعي" class="input-glass" required>
                <input type="email" id="re" placeholder="البريد الإلكتروني" class="input-glass" required>
                <input type="password" id="rp" placeholder="كلمة المرور" class="input-glass" required>
                <button type="submit" class="btn-primary mt-4">إرسال طلب الانضمام</button>
            </form>
            <p id="msg" class="text-center text-xs mt-4 text-blue-400 font-bold"></p>
        </div>
    </div>

    <script>
        // بيانات الأدمن الثابتة
        const ADMIN_EMAIL = "doctor.ali.saad@gmail.com";
        const ADMIN_PASS = "Dr.AliSaad111222#";

        function tab(t){
            document.getElementById('f-l').classList.toggle('hidden', t==='reg');
            document.getElementById('f-r').classList.toggle('hidden', t==='login');
            document.getElementById('l-t').className = t==='login'?'tab-btn active':'tab-btn';
            document.getElementById('r-t').className = t==='reg'?'tab-btn active':'tab-btn';
        }

        function handleRegister(e){
            e.preventDefault();
            let students = JSON.parse(localStorage.getItem('students')) || [];
            const newStudent = {
                name: document.getElementById('rn').value,
                email: document.getElementById('re').value,
                pass: document.getElementById('rp').value,
                status: 'pending'
            };
            students.push(newStudent);
            localStorage.setItem('students', JSON.stringify(students));
            document.getElementById('msg').innerText = "تم إرسال طلبك بنجاح! انتظر موافقة د. علي.";
            e.target.reset();
        }

        function handleLogin(e){
            e.preventDefault();
            const email = document.getElementById('le').value;
            const pass = document.getElementById('lp').value;

            // التأكد من الأدمن
            if(email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                window.location.href = 'admin.html';
                return;
            }

            // التأكد من الطلاب
            let students = JSON.parse(localStorage.getItem('students')) || [];
            let user = students.find(s => s.email === email && s.pass === pass);

            if(user) {
                if(user.status === 'active') {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    window.location.href = 'student.html';
                } else {
                    alert('عذراً، حسابك بانتظار تفعيل الدكتور.');
                }
            } else {
                alert('البيانات غير صحيحة أو الحساب غير موجود.');
            }
        }
    </script>
</body>
</html>
